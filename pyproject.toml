[project]
name = "aero-workspace"
version = "0.4.0"
description = "Repo-wide development environment for dynbem + dynbem_rs. Not published to PyPI; the publishable package is `dynbem/` (Rust-backed)."
requires-python = ">=3.11"
dependencies = [
    # PyYAML is used by dynbem.rotor_definition (Python-side YAML loading)
    # and by the verification/ scripts that drive Docker tools.
    "dynbem",
    "PyYAML>=6.0.3",
    # Plot output from envelope.compute_map and the verification scripts.
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.5",
    "maturin>=1.15,<2.0",
    "build>=1.6.1",
    "twine>=7",
]

# ---------------------------------------------------------------------------
# uv workspace. `uv sync` from the repo root installs dynbem in editable
# mode (which builds the Rust extension via maturin) plus PyYAML; add
# `--group dev` to also pull pytest et al.
#
# `dynbem_rs/` is a pure-Rust crate in the Cargo workspace at
# ./Cargo.toml (not a uv/Python workspace member).
# ---------------------------------------------------------------------------
[tool.uv.workspace]
members = ["dynbem"]

[tool.uv.sources]
dynbem = { workspace = true }

[[tool.uv.index]]
name = "microsoft-python"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.pytest.ini_options]
timeout = 10
testpaths = ["tests"]
# Repo root on sys.path so tests can import `envelope`, `verification`,
# etc. The `python -m pytest` invocation does this implicitly; the
# `pytest` CLI (used by `uv run pytest` in CI) does not, hence the
# explicit setting.
pythonpath = ["."]
