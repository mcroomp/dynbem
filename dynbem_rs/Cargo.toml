[package]
name = "dynbem_rs"
description = "Pure-Rust BEM / Pitt-Peters / Oye dynamic-inflow rotor models. No pyo3 / numpy."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["rotor", "aerodynamics", "bem", "helicopter", "dynamics"]
categories = ["science", "simulation"]
exclude = ["CLAUDE.md"]

[lib]
name = "dynbem_rs"
path = "src/lib.rs"

[dependencies]
aligned = "0.4"
aligned-vec = "0.6"
bytemuck = "1"
wide = "0.7"
rayon = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "model_kernels"
harness = false

[[bin]]
name = "rotor_profile"
path = "bin/rotor_profile.rs"
