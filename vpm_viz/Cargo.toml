[package]
name = "vpm_viz"
version = "0.9.0"
edition = "2024"
rust-version = "1.99"

# Standalone project -- NOT a member of the parent workspace.
[workspace]

[[bin]]
name = "vpm_viz"
path = "src/main.rs"

[dependencies]
dynbem_rs = { path = "../dynbem_rs" }
eframe  = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui    = "0.37"

[profile.release]
opt-level = 3
lto = "thin"
