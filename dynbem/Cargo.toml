[package]
name = "dynbem"
description = "Python bindings (PyO3) for dynbem_rs: BEM / Pitt-Peters / Oye dynamic-inflow rotor models."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "_dynbem"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["stubgen"]

[features]
stubgen = ["dep:pyo3-stub-gen"]

[dependencies]
dynbem_rs = { path = "../dynbem_rs" }
pyo3 = { workspace = true }
numpy = { workspace = true }
pyo3-stub-gen = { version = "0.23.2", optional = true }
pyo3-stub-gen-derive = "0.23.2"
