name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Rust toolchain is needed because `uv sync` triggers a maturin
      # build of the dynbem cdylib (PyO3 extension).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      # uv sync resolves the workspace, installs PyYAML / numpy / pytest /
      # maturin etc., and editable-installs the dynbem package (compiling
      # the Rust extension via maturin in the process).
      - name: Install workspace + dev deps
        run: uv sync --group dev

      - name: Verify generated PyO3 stubs
        run: |
          uv run cargo run -p dynbem --features stubgen --bin stub_gen
          git diff --exit-code -- dynbem/python/dynbem/_dynbem

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Pyright
        run: uv run pyright

      - name: Run tests
        # --timeout=0 disables the per-test 10s wall-clock cap that's set
        # in pyproject.toml for local runs. CI runners are noisier than
        # dev boxes and shouldn't fail on timing alone.
        run: uv run pytest tests/ -q --timeout=0

      - name: Test published package on Python 3.12
        run: >-
          uv run --isolated --no-project --python 3.12
          --with ./dynbem --with pytest --with pytest-timeout --with matplotlib
          pytest tests/ -q --timeout=0

      - name: Sanity-build release wheel
        run: uv run maturin build --release --manifest-path dynbem/Cargo.toml

  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      # Pure-Rust crate (dynbem_rs) must compile without pyo3/numpy in
      # the dependency graph -- guard against accidentally pulling them
      # in by checking it standalone.
      - name: cargo check (pure Rust core)
        run: cargo check -p dynbem_rs

      - name: cargo check (full workspace)
        run: cargo check --workspace

      - name: Rust release tests
        run: cargo test --release --workspace

      - name: cargo check (standalone visualizer)
        run: cargo check --manifest-path vpm_viz/Cargo.toml
